[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy /api requests to Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback for React Router (Prevents 404 errors on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
