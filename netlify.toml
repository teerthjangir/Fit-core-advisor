[build]
  publish = "dist"
  command = "npm run build"

# Proxy /api requests to your live backend (Replace the URL once you deploy the backend)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback for React Router (Prevents 404 errors on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
