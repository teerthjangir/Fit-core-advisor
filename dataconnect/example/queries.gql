query GetMyAssessments @auth(level: USER) {
  assessments(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    dateCompleted
    bodyType
    fitnessLevel
    goals
    heightCm
    weightKg
    activityLevel
  }
}

mutation CreateUserDietPlan(
  $assessmentId: UUID!
  $name: String!
  $startDate: Date!
  $endDate: Date!
  $caloriesPerDay: Int!
  $mealRecommendations: String!
) @auth(level: USER) {
  dietPlan: dietPlan_insert(
    data: {
      userId_expr: "auth.uid"
      assessment: { id: $assessmentId }
      name: $name
      startDate: $startDate
      endDate: $endDate
      caloriesPerDay: $caloriesPerDay
      mealRecommendations: $mealRecommendations
      createdAt_expr: "request.time"
    }
  )
}

query ListAllPublicWorkoutPlans @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  workoutPlans {
    id
    name
    description
    startDate
    endDate
    exerciseRecommendations
    frequencyPerWeek
    user {
      displayName
    }
  }
}

mutation LogUserProgress(
  $date: Date!
  $weightKg: Float!
  $metricType: String!
  $metricValue: Float!
  $notes: String
) @auth(level: USER) {
  progressLog: progressLog_insert(
    data: {
      userId_expr: "auth.uid"
      date: $date
      weightKg: $weightKg
      metricType: $metricType
      metricValue: $metricValue
      notes: $notes
      createdAt_expr: "request.time"
    }
  )
}