type User @table {
  googleId: String!
  displayName: String!
  email: String!
  createdAt: Timestamp!
  photoUrl: String
}

type Assessment @table {
  user: User!
  bodyType: String!
  fitnessLevel: String!
  goals: [String!]!
  heightCm: Float!
  weightKg: Float!
  gender: String!
  dateCompleted: Date!
  activityLevel: String
}

type DietPlan @table {
  user: User!
  assessment: Assessment!
  name: String!
  startDate: Date!
  endDate: Date!
  caloriesPerDay: Int!
  mealRecommendations: String! # Storing as JSON string
  createdAt: Timestamp!
  description: String
}

type WorkoutPlan @table {
  user: User!
  assessment: Assessment!
  name: String!
  startDate: Date!
  endDate: Date!
  exerciseRecommendations: String! # Storing as JSON string
  frequencyPerWeek: Int!
  createdAt: Timestamp!
  description: String
}

type ProgressLog @table {
  user: User!
  date: Date!
  weightKg: Float!
  metricType: String!
  metricValue: Float!
  createdAt: Timestamp!
  notes: String
}